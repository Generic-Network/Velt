name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Vulkan SDK components
        sudo apt-get install -y libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools
        # SDL3 build dependencies (X11 and other libraries)
        sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev
        # OpenGL libraries for SDL3
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev
        # Other SDL3 dependencies
        sudo apt-get install -y libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

    - name: Install Vulkan SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install molten-vk vulkan-headers vulkan-loader

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        
        # Download Vulkan SDK installer
        $version = "1.3.290.0"
        $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
        $installer = "$env:TEMP\VulkanSDK-Installer.exe"
        
        Write-Host "Downloading Vulkan SDK $version..."
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
        
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath $installer -ArgumentList '/S' -Wait -NoNewWindow
        
        # Add to PATH
        $vulkanPath = "C:\VulkanSDK\$version"
        echo "$vulkanPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "VULKAN_SDK=$vulkanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install CMake (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
        sudo apt-add-repository 'deb https://apt.kitware.com/ubuntu/ noble main'
        sudo apt-get update
        sudo apt-get install -y cmake

    - name: Install CMake (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install CMake (Windows)
      if: runner.os == 'Windows'
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build --config Release
